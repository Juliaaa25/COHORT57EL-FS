<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Напоминание о тест-драйве</title>
</head>
<body style="background:#f5f5f5; font-family: Arial, sans-serif;">
<table width="100%" style="padding:20px;">
    <tr>
        <td align="center">
            <table width="600" style="background:#ffffff; border-radius:12px;">
                <tr>
                    <td style="background:#2563eb; color:#fff; padding:20px;">
                        <b>59 Auto Center</b><br/>
                        Напоминание о тест-драйве
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <p>
                            Здравствуйте, <b th:text="${clientName}"></b>!
                        </p>

                        <p>
                            Напоминаем, что вы записаны на тест-драйв:
                        </p>

                        <p>
                            <b>
                                <span th:text="${carBrand}"></span>
                                <span th:text="${carModel}"></span>
                            </b>
                        </p>

                        <p>
                            Дата и время:
                            <b th:text="${testDriveDateTime}"></b>
                        </p>

                        <p>
                            Адрес салона:
                            <b th:text="${dealerAddress}"></b>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
