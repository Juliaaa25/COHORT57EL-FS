<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Подтверждение тест-драйва</title>
</head>
<body style="background:#f5f5f5; font-family: Arial, sans-serif;">
<table width="100%" style="padding:20px;">
    <tr>
        <td align="center">
            <table width="600" style="background:#ffffff; border-radius:12px;">
                <tr>
                    <td style="background:#111827; color:#fff; padding:20px;">
                        <b>59 Auto Center</b><br/>
                        Подтверждение тест-драйва
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <p>Здравствуйте, <b th:text="${clientName}">Клиент</b>!</p>

                        <p>
                            Вы записаны на тест-драйв автомобиля:
                            <b>
                                <span th:text="${carBrand}"></span>
                                <span th:text="${carModel}"></span>
                            </b>
                        </p>

                        <p>
                            Дата и время:
                            <b th:text="${testDriveDateTime}"></b>
                        </p>

                        <p>
                            Адрес салона:<br/>
                            <b th:text="${dealerAddress}"></b><br/>
                            Телефон: <b th:text="${dealerPhone}"></b>
                        </p>

                        <a th:href="${cancelUrl}"
                           style="display:inline-block;
                           margin-top:16px;
                           padding:12px 18px;
                           background:#dc2626;
                           color:#fff;
                           text-decoration:none;
                           border-radius:8px;">
                            Отменить запись
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px; font-size:12px; color:#6b7280;">
                        Это автоматическое письмо. Если вы не записывались — просто проигнорируйте.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
